name: "Setup apx CLI"
description: "Download and verify the apx CLI binary with SHA-256 checksum"

inputs:
  version:
    description: "apx release version (e.g. v0.3.8)"
    required: true
    default: "v0.3.8"

runs:
  using: "composite"
  steps:
    - name: Download and verify apx
      shell: bash
      env:
        APX_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        INSTALL_DIR="$HOME/.local/bin"
        mkdir -p "$INSTALL_DIR"

        # Match official install.sh asset naming: apx-${ARCH}-${PLATFORM}
        case "$(uname -m)" in
          x86_64|amd64) ARCH="x86_64" ;;
          aarch64|arm64) ARCH="aarch64" ;;
          *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        BINARY="apx-${ARCH}-linux"
        BASE_URL="https://github.com/databricks-solutions/apx/releases/download/${APX_VERSION}"

        echo "→ Downloading apx ${APX_VERSION} (${BINARY})..."
        curl -fsSL -o "/tmp/apx" "${BASE_URL}/${BINARY}"

        echo "→ Verifying SHA-256 checksum via GitHub API..."
        EXPECTED="$(curl -fsSL \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/databricks-solutions/apx/releases/tags/${APX_VERSION}" \
          | BINARY="$BINARY" python3 -c 'import json, os, sys; asset = next(a for a in json.load(sys.stdin)["assets"] if a["name"] == os.environ["BINARY"]); digest = asset.get("digest") or ""; assert digest.startswith("sha256:"), f"missing digest for {os.environ['"'"'BINARY'"'"']}"; print(digest.removeprefix("sha256:"))')"
        ACTUAL="$(sha256sum /tmp/apx | awk '{print $1}')"
        if [[ "$ACTUAL" != "$EXPECTED" ]]; then
          echo "Checksum mismatch: expected $EXPECTED, got $ACTUAL" >&2
          exit 1
        fi
        echo "✓ Checksum verified"

        echo "→ Installing..."
        mv /tmp/apx "$INSTALL_DIR/apx"
        chmod +x "$INSTALL_DIR/apx"

        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        echo "✓ apx ${APX_VERSION} installed to $INSTALL_DIR"
